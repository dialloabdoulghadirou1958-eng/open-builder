name: Release Android ARM64

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: pnpm tauri android init

      # ---------------------------------------------------------
      # Generate a temporary signing key
      # ---------------------------------------------------------
      - name: Generate temporary Android signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/android-release.keystore" \
            -storetype PKCS12 \
            -storepass "openbuilder123" \
            -keypass "openbuilder123" \
            -alias "openbuilder" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Open Builder, OU=Open Builder, O=Open Builder, C=US"

      # ---------------------------------------------------------
      # Configure Gradle signing
      # ---------------------------------------------------------
      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="src-tauri/gen/android/app"

          cat > "$APP_DIR/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android-release.keystore
          storePassword=openbuilder123
          keyAlias=openbuilder
          keyPassword=openbuilder123
          EOF

          GRADLE_FILE="$APP_DIR/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()

          if "java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\nimport java.util.Properties\n\n" + text

          signing_block = r'''
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                      }
                  }
              }
          }
          '''

          marker = "signingConfigs {"

          if marker not in text:
              android_marker = "android {"
              if android_marker not in text:
                  raise SystemExit("android block not found")

              text = text.replace(
                  android_marker,
                  signing_block + "\n" + android_marker,
                  1
              )

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              build_types = 'buildTypes {'

              if build_types not in text:
                  raise SystemExit("buildTypes block not found")

              replacement = '''buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              '''

              text = text.replace(build_types, replacement, 1)

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Build ARM64 APK
      # ---------------------------------------------------------
      - name: Build Android ARM64 APK
        run: pnpm tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      # ---------------------------------------------------------
      # Locate generated APK
      # ---------------------------------------------------------
      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "APK files generated by Tauri:"

          find src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name "*-release.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Signed release APK not found."

            echo "All APK files:"
            find src-tauri/gen/android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "Signed APK:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/open-builder-android-arm64.apk"

      # ---------------------------------------------------------
      # Verify signature
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$GITHUB_WORKSPACE/open-builder-android-arm64.apk"

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-builder-android-arm64
          path: open-builder-android-arm64.apk
          if-no-files-found: error
          retention-days: 7
