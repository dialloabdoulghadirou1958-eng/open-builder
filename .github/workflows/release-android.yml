name: Release Android ARM64

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4


      # ============================================================
      # PNPM
      # ============================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3


      # ============================================================
      # ANDROID NDK
      # ============================================================

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"


      # ============================================================
      # RUST ARM64 ONLY
      # ============================================================

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-linux-android


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile


      # ============================================================
      # INITIALIZE TAURI ANDROID PROJECT
      # ============================================================

      - name: Initialize Android project
        run: |
          pnpm tauri android init


      # ============================================================
      # GENERATE TEMPORARY ANDROID KEYSTORE
      # ============================================================

      - name: Generate temporary Android signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/open-builder-release.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "openbuilder123" \
            -keypass "openbuilder123" \
            -alias "openbuilder" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Open Builder, OU=Open Builder, O=Open Builder, C=US"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"


      # ============================================================
      # CONFIGURE TAURI/GRADLE SIGNING
      #
      # IMPORTANT:
      # We DO NOT add imports blindly.
      # We modify the generated Gradle file safely.
      # ============================================================

      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$GITHUB_WORKSPACE/src-tauri/gen/android"
          APP_GRADLE="$ANDROID_DIR/app/build.gradle.kts"

          # --------------------------------------------------------
          # Create keystore.properties
          # --------------------------------------------------------

          cat > "$ANDROID_DIR/keystore.properties" <<EOF
          storePassword=openbuilder123
          keyPassword=openbuilder123
          keyAlias=openbuilder
          storeFile=$KEYSTORE
          EOF

          # --------------------------------------------------------
          # Check existing imports
          # --------------------------------------------------------

          echo "Existing imports:"
          head -n 30 "$APP_GRADLE"

          # --------------------------------------------------------
          # Add imports ONLY if they do not already exist
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()

          imports = [
              "import java.util.Properties",
              "import java.io.FileInputStream",
          ]

          lines = text.splitlines()

          existing = set(
              line.strip()
              for line in lines
              if line.strip().startswith("import ")
          )

          missing = [item for item in imports if item not in existing]

          if missing:
              insert_at = 0

              while insert_at < len(lines) and (
                  lines[insert_at].strip().startswith("import ")
                  or lines[insert_at].strip() == ""
              ):
                  insert_at += 1

              lines[insert_at:insert_at] = missing + [""]

          path.write_text("\n".join(lines) + "\n")
          PY

          # --------------------------------------------------------
          # Configure signing block
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()

          if 'create("release")' not in text or "signingConfigs" not in text:

              signing_block = r'''
          signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()

                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }

                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }

          '''

              marker = "buildTypes {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: buildTypes block not found in build.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  signing_block + marker,
                  1
              )

          # --------------------------------------------------------
          # Configure release build type
          # --------------------------------------------------------

          if 'signingConfig = signingConfigs.getByName("release")' not in text:

              marker = 'getByName("release") {'

              if marker in text:

                  text = text.replace(
                      marker,
                      marker + '\n        signingConfig = signingConfigs.getByName("release")',
                      1
                  )

              else:

                  marker = "buildTypes {"

                  if marker not in text:
                      raise SystemExit(
                          "ERROR: buildTypes block not found"
                      )

                  release_block = '''
              getByName("release") {
                  signingConfig = signingConfigs.getByName("release")
              }
          '''

                  text = text.replace(
                      marker,
                      marker + release_block,
                      1
                  )

          path.write_text(text)
          PY

          echo ""
          echo "===== FINAL build.gradle.kts ====="
          cat "$APP_GRADLE"
          echo ""
          echo "===== keystore.properties ====="
          cat "$ANDROID_DIR/keystore.properties"


      # ============================================================
      # BUILD ARM64 APK
      # ============================================================

      - name: Build Android ARM64 APK
        run: |
          pnpm tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973


      # ============================================================
      # LOCATE APK
      # ============================================================

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "===== GENERATED APK FILES ====="

          find src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find \
            src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name "*-release.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Signed release APK was not found."

            find src-tauri/gen/android/app/build/outputs \
              -type f \
              -print

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/open-builder-android-arm64.apk"


      # ============================================================
      # VERIFY ABI
      #
      # ARM64 MUST exist.
      # Other Android ABIs MUST NOT exist.
      # ============================================================

      - name: Verify ARM64 only
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/open-builder-android-arm64.apk"

          echo "===== NATIVE LIBRARIES ====="

          unzip -l "$APK" | \
            grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/" \
            || true

          echo ""
          echo "Checking ARM64..."

          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then
            echo "ERROR: arm64-v8a is missing."
            exit 1
          fi

          echo "ARM64 detected."


      # ============================================================
      # VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$GITHUB_WORKSPACE/open-builder-android-arm64.apk"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-builder-android-arm64
          path: ${{ github.workspace }}/open-builder-android-arm64.apk
          if-no-files-found: error
          retention-days: 7
