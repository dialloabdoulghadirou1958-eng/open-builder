name: Release Android ARM64

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: pnpm tauri android init

      - name: Build Android APK ARM64
        run: pnpm tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Find unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name "*-release-unsigned.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Unsigned APK not found."
            echo "Available APK files:"
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print
            exit 1
          fi

          echo "Unsigned APK found:"
          echo "$APK"

          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: Verify APK architectures
        shell: bash
        run: |
          set -euo pipefail

          echo "Native libraries inside APK:"
          unzip -l "$UNSIGNED_APK" | \
            grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/" || true

      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/open-builder-release.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "openbuilder123" \
            -keypass "openbuilder123" \
            -alias "openbuilder" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Open Builder, OU=Open Builder, O=Open Builder, C=US"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS/zipalign" \
            -P 16 \
            -f 4 \
            "$UNSIGNED_APK" \
            "$RUNNER_TEMP/open-builder-aligned.apk"

          echo "ALIGNED_APK=$RUNNER_TEMP/open-builder-aligned.apk" >> "$GITHUB_ENV"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "openbuilder" \
            --ks-pass pass:openbuilder123 \
            --key-pass pass:openbuilder123 \
            --out "$RUNNER_TEMP/open-builder-arm64-release.apk" \
            "$ALIGNED_APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/open-builder-arm64-release.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-builder-android-arm64
          path: ${{ env.RUNNER_TEMP }}/open-builder-arm64-release.apk
          if-no-files-found: error
          retention-days: 7
